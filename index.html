<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Dedetização | Diagnóstico e Soluções</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fbf9;
      color: #1e2e1e;
      overflow-x: hidden;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 40, 0, 0.08);
      z-index: 1000;
      padding: 0.8rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: 0.3s;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.6rem;
      color: #1b5e20;
      letter-spacing: 1px;
    }

    .logo img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      border-radius: 8px;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 8px;
      z-index: 1100;
      transition: 0.3s;
    }

    .hamburger span {
      display: block;
      width: 30px;
      height: 3px;
      background-color: #2e7d32;
      border-radius: 4px;
      transition: 0.3s;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    .nav-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 280px;
      height: 100vh;
      background: #ffffff;
      box-shadow: -5px 0 30px rgba(0, 0, 0, 0.1);
      z-index: 1050;
      padding: 5rem 2rem 2rem;
      transition: 0.4s ease-in-out;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      border-left: 2px solid #c8e6c9;
    }

    .nav-menu.active {
      right: 0;
    }

    .nav-menu a {
      text-decoration: none;
      color: #1e2e1e;
      font-size: 1.2rem;
      font-weight: 500;
      padding: 0.5rem 0;
      border-bottom: 1px solid #e0f2e0;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-menu a:hover {
      color: #2e7d32;
      padding-left: 8px;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(3px);
      z-index: 1040;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem 4rem;
      overflow: hidden;
      margin-top: 0;
    }

    .slider-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.8s ease-in-out;
      background-color: #1b3b1b;
    }

    .slide.active {
      opacity: 1;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(0, 20, 0, 0.75), rgba(10, 50, 10, 0.6));
      z-index: 1;
    }

    .quiz-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(46, 125, 50, 0.2);
      margin: 0 auto;
    }

    .quiz-container h1 {
      font-size: 2.2rem;
      color: #1b5e20;
      margin-bottom: 0.5rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .quiz-container .subhead {
      color: #3e5e3e;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .quiz-step {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .quiz-step.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .step-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1e3a1e;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-title span {
      background: #2e7d32;
      color: white;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.1rem;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin: 2rem 0 1rem;
    }

    .option-card {
      background: #ffffff;
      border: 2px solid #c8e6c9;
      border-radius: 22px;
      padding: 0;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(0, 40, 0, 0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .option-card:hover {
      border-color: #2e7d32;
      transform: translateY(-6px);
      box-shadow: 0 18px 30px rgba(46, 125, 50, 0.18);
    }

    .option-card.selected {
      border-color: #1b5e20;
      background: #f1f9f1;
      box-shadow: 0 10px 25px rgba(46, 125, 50, 0.3);
    }

    .option-img-wrap {
      width: 100%;
      height: 150px;
      overflow: hidden;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid #c8e6c9;
    }

    .option-card.selected .option-img-wrap {
      border-bottom-color: #2e7d32;
    }

    .option-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.4s ease;
      display: block;
    }

    .option-card:hover .option-img-wrap img {
      transform: scale(1.06);
    }

    .option-card-body {
      padding: 1.1rem 1rem 1.4rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: center;
    }

    .option-card h3 {
      font-size: 1.3rem;
      color: #1b5e20;
      margin-bottom: 0.35rem;
      font-weight: 700;
    }

    .option-card p {
      color: #3e5e3e;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .package-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin: 2rem 0;
    }

    .package-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 1.8rem 1rem;
      text-align: center;
      border: 1px solid #d0e8d0;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
      transition: 0.2s;
      cursor: pointer;
    }

    .package-card:hover {
      box-shadow: 0 16px 28px rgba(46, 125, 50, 0.15);
      border-color: #2e7d32;
    }

    .package-card.selected {
      border: 3px solid #2e7d32;
      background: #f1f9f1;
    }

    .package-icon {
      font-size: 2.8rem;
      margin-bottom: 0.8rem;
    }

    .package-card h3 {
      font-size: 1.4rem;
      color: #1b5e20;
      margin-bottom: 0.5rem;
    }

    .package-card .price {
      font-size: 1.8rem;
      font-weight: 800;
      color: #1b5e20;
      margin: 0.8rem 0;
    }

    .package-card .price small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #4b6b4b;
    }

    .package-card p {
      color: #3e5e3e;
      font-size: 0.95rem;
      margin-bottom: 0.3rem;
    }

    .btn {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 0.9rem 2.5rem;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 14px rgba(46, 125, 50, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background: #1b5e20;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(46, 125, 50, 0.4);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-outline {
      background: transparent;
      color: #2e7d32;
      border: 2px solid #2e7d32;
      box-shadow: none;
    }

    .btn-outline:hover {
      background: #e8f5e9;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin: 1.5rem 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group.full {
      grid-column: span 2;
    }

    .form-group label {
      font-weight: 600;
      color: #1e3a1e;
      font-size: 0.95rem;
    }

    .form-group input, .form-group select, .form-group textarea {
      padding: 0.9rem 1rem;
      border: 1.5px solid #c8e6c9;
      border-radius: 14px;
      font-size: 1rem;
      background: #ffffff;
      transition: 0.2s;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: #2e7d32;
      box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.15);
    }

    .resumo-diagnostico {
      background: #e8f5e9;
      padding: 1.2rem;
      border-radius: 20px;
      margin: 1.2rem 0;
      border-left: 6px solid #2e7d32;
    }

    .resumo-diagnostico p {
      margin: 0.3rem 0;
      color: #1e3a1e;
      font-weight: 500;
    }

    .resumo-diagnostico strong {
      color: #1b5e20;
    }

    .thank-you-screen {
      display: none;
      text-align: center;
      padding: 2rem 1rem;
      animation: fadeIn 0.5s ease;
    }

    .thank-you-screen.active {
      display: block;
    }

    .thank-you-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 30px rgba(46, 125, 50, 0.35);
      animation: popIn 0.5s ease;
    }

    .thank-you-icon svg {
      width: 55px;
      height: 55px;
      stroke: #ffffff;
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .thank-you-screen h2 {
      font-size: 2rem;
      color: #1b5e20;
      margin-bottom: 0.8rem;
      font-weight: 700;
    }

    .thank-you-screen p {
      font-size: 1.15rem;
      color: #3e5e3e;
      line-height: 1.7;
      max-width: 550px;
      margin: 0 auto 0.8rem;
    }

    .thank-you-screen .highlight {
      color: #1b5e20;
      font-weight: 700;
    }

    .thank-you-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #1b5e20;
      padding: 0.7rem 1.5rem;
      border-radius: 60px;
      font-weight: 600;
      margin-top: 1.2rem;
      border: 2px solid #c8e6c9;
